syntax = "proto3";

package notes.v1;

import "google/protobuf/timestamp.proto";

// NotesService is a typed front for notes kept in the Store's "notes"
// namespace. A note is stored as its JSON form, so the generic StoreService
// sees the same documents and revisions; this service only adds the Note
// type, so a notes app gets checked fields instead of a loose Struct.
service NotesService {
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  // Replaces a note's fields. Pass the revision you edited to refuse a
  // write over someone else's.
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Notes changed after `since_revision`; deleted ones come back with
  // `deleted` set when `since_revision` is above 0, so a sync can drop them.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Every change after `since_revision`, then each new one.
  rpc WatchNotes(WatchNotesRequest) returns (stream WatchNotesResponse);
}

message Note {
  string id = 1;
  string title = 2;
  // Markdown.
  string body = 3;
  repeated string tags = 4;
  bool pinned = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Set by the server.
  int64 revision = 8;
  bool deleted = 9;
}

message CreateNoteRequest {
  // Only title, body, tags and pinned are read. An id may be given (e.g. one
  // made offline on the phone); otherwise the server makes one.
  Note note = 1;
}

message CreateNoteResponse {
  Note note = 1;
}

message UpdateNoteRequest {
  Note note = 1;
  // 0: write regardless.
  int64 expected_revision = 2;
}

message UpdateNoteResponse {
  Note note = 1;
}

message DeleteNoteRequest {
  string id = 1;
  int64 expected_revision = 2;
}

message DeleteNoteResponse {
  Note note = 1;
}

message GetNoteRequest {
  string id = 1;
}

message GetNoteResponse {
  Note note = 1;
}

message ListNotesRequest {
  int64 since_revision = 1;
  int32 limit = 2;
}

message ListNotesResponse {
  repeated Note notes = 1;
  int64 revision = 2;
  bool more = 3;
}

message WatchNotesRequest {
  int64 since_revision = 1;
}

message WatchNotesResponse {
  Note note = 1;
}
